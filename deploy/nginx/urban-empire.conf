server {
    listen 80;
    server_name tycoon.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tycoon.example.com;

    ssl_certificate /etc/letsencrypt/live/tycoon.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tycoon.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://urban-empire:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
